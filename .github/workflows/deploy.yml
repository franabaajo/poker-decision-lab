name: Deploy to Hugging Face Spaces

# Runs manually from the Actions tab, and automatically after CI passes on main.
# Requires repository secret HF_TOKEN (write token) and variable HF_SPACE (e.g. "username/poker-decision-lab").
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set; skipping deploy."
            exit 0
          fi
          # Spaces read their config from README front matter, so the Space gets its own README.
          mkdir /tmp/space
          cp -r Dockerfile .dockerignore pyproject.toml uv.lock src app /tmp/space/
          cp deploy/space-README.md /tmp/space/README.md
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
