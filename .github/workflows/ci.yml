name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  browser-engine:
    # The online demo runs the engine in the browser with Pyodide; check that it works there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the static site
        run: python3 scripts/build_site.py
      - name: Run the engine in Pyodide
        run: |
          npm install --no-save pyodide@314.0.2
          node scripts/pyodide_smoke.mjs
