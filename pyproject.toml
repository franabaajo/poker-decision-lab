[project]
name = "pokerlab"
version = "0.1.0"
description = "Educational heads-up Texas Hold'em decision analyser: equity, pot odds and expected value under explicit opponent-range assumptions."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fernando Abajo" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.5.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",  # needed by FastAPI's TestClient
    "hypothesis>=6.170.14",
    "pytest>=8",
    "ruff>=0.6",
    "treys>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # lets tests import the `app` package
addopts = "-ra"
markers = ["slow: long-running exhaustive tests (deselect with -m \"not slow\")"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
